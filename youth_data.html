    <!-- 폰트 설정 (Pretendard) -->

    <!-- 아이콘 (FontAwesome) -->

    <!-- D3.js (지도 시각화용) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef6fc',
                            100: '#daecf8',
                            200: '#bce0f2',
                            300: '#8ecde9',
                            400: '#5ab3de',
                            500: '#389bd2',
                            600: '#267fba',
                            700: '#206597',
                            800: '#1d557f',
                            900: '#005BAC', // 메인 포인트 컬러
                            950: '#123755',
                        },
                        surface: '#ffffff',
                        background: '#f4f6f9',
                    },
                    boxShadow: {
                        'card': '0 2px 10px rgba(0, 0, 0, 0.05)',
                        'card-hover': '0 4px 20px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f4f6f9; color: #333; }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 지도 관련 스타일 */
        .province-path {
            stroke: #ffffff;
            stroke-width: 3px;
            stroke-linejoin: round;
            stroke-linecap: round;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .province-path:hover {
            filter: brightness(0.9);
        }
        .municipality-path {
            stroke: #ffffff;
            stroke-width: 1.5px;
            stroke-linejoin: round;
            stroke-linecap: round;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .municipality-path:hover {
            filter: brightness(0.9);
        }
        .province-label {
            pointer-events: none;
            font-size: 11px;
            font-weight: 600;
            fill: #333;
            text-anchor: middle;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
        }
        .tooltip {
            position: absolute;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: none;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 50;
            border-left: 4px solid #005BAC;
        }
        
        /* 테이블 헤더 고정 */
        .sticky-header th { position: sticky; top: 0; background-color: #f8fafc; z-index: 10; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8 flex justify-center">

        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-card">

                <p class="text-sm text-gray-500 mt-1">데이터 기준일: 2026. 07. 20</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="기관명 검색..." class="pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-900 focus:border-transparent w-64 transition-all">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400"></i>
                </div>
                <button class="flex items-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm" onclick="alert('엑셀 다운로드 기능은 실제 서버 연동 시 작동합니다.')">

        <div class="flex flex-col gap-4">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <!-- Map Container -->

                    <!-- D3 Map will be injected here -->

                    </div>
                </div>

        <div class="bg-white rounded-xl shadow-card overflow-hidden">

                <div class="text-sm text-gray-500">

            <div class="overflow-x-auto max-h-[500px]">

                            <th scope="col" class="px-4 py-3 font-semibold">운영사업 (태그)</th>
                            <th scope="col" class="px-4 py-3 font-semibold w-36">연락처</th>
                            <th scope="col" class="px-4 py-3 font-semibold text-center w-20">홈페이지</th>
                        </tr>
                    </thead>
                    <tbody id="facilityTableBody" class="divide-y divide-gray-100">
                        <!-- Table rows generated by JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination (Mock) -->
            <div class="p-4 border-t border-gray-100 flex items-center justify-between bg-white">
                <span class="text-sm text-gray-500">1-50 / 전체 데이터 표시중 (스크롤)</span>
                <div class="flex gap-1">
                    <button class="px-3 py-1 border border-gray-200 rounded text-gray-400 cursor-not-allowed bg-gray-50">&lt;</button>
                    <button class="px-3 py-1 border border-primary-900 rounded bg-primary-900 text-white">1</button>
                    <button class="px-3 py-1 border border-gray-200 rounded text-gray-600 hover:bg-gray-50">2</button>
                    <button class="px-3 py-1 border border-gray-200 rounded text-gray-600 hover:bg-gray-50">3</button>
                    <button class="px-3 py-1 border border-gray-200 rounded text-gray-600 hover:bg-gray-50">&gt;</button>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Tooltip Element -->
    <div id="tooltip" class="tooltip"></div>

    <script>
        // --- 1. 상태 관리 (State) ---
        const state = {
            project: '전체', // '전체', '청소년자기도전포상제', '국제성취포상제', '자원봉사', '청소년수련활동인증'
            province: null,  // '서울특별시', '경기도' 등
            district: null,  // '수원시', '강남구' 등
            searchQuery: ''
        };

        // --- 2. 기본 데이터 정의 ---
        const PROJECTS = [
            { id: 'all', name: '전체' },
            { id: 'challenge', name: '청소년자기도전포상제', color: 'bg-blue-100 text-blue-800 border-blue-200' },
            { id: 'international', name: '국제성취포상제', color: 'bg-indigo-100 text-indigo-800 border-indigo-200' },
            { id: 'volunteer', name: '자원봉사', color: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
            { id: 'cert', name: '청소년수련활동인증', color: 'bg-amber-100 text-amber-800 border-amber-200' }
        ];

        // 시도 및 가상의 시군구 데이터
        const REGIONS = {
            '서울특별시': ['종로구', '중구', '용산구', '성동구', '광진구', '동대문구', '중랑구', '성북구', '강북구', '도봉구', '노원구', '은평구', '서대문구', '마포구', '양천구', '강서구', '구로구', '금천구', '영등포구', '동작구', '관악구', '서초구', '강남구', '송파구', '강동구'],
            '부산광역시': ['중구', '서구', '동구', '영도구', '부산진구', '동래구', '남구', '북구', '해운대구', '사하구', '금정구', '강서구', '연제구', '수영구', '사상구', '기장군'],
            '대구광역시': ['중구', '동구', '서구', '남구', '북구', '수성구', '달서구', '달성군', '군위군'],
            '인천광역시': ['중구', '동구', '미추홀구', '연수구', '남동구', '부평구', '계양구', '서구', '강화군', '옹진군'],
            '광주광역시': ['동구', '서구', '남구', '북구', '광산구'],
            '대전광역시': ['동구', '중구', '서구', '유성구', '대덕구'],
            '울산광역시': ['중구', '남구', '동구', '북구', '울주군'],
            '세종특별자치시': ['세종시'],
            '경기도': ['수원시', '성남시', '의정부시', '안양시', '부천시', '광명시', '평택시', '동두천시', '안산시', '고양시', '과천시', '구리시', '남양주시', '오산시', '시흥시', '군포시', '의왕시', '하남시', '용인시', '파주시', '이천시', '안성시', '김포시', '화성시', '광주시', '양주시', '포천시', '여주시', '연천군', '가평군', '양평군'],
            '강원특별자치도': ['춘천시', '원주시', '강릉시', '동해시', '태백시', '속초시', '삼척시', '홍천군', '횡성군', '영월군', '평창군', '정선군', '철원군', '화천군', '양구군', '인제군', '고성군', '양양군'],
            '충청북도': ['청주시', '충주시', '제천시', '보은군', '옥천군', '영동군', '증평군', '진천군', '괴산군', '음성군', '단양군'],
            '충청남도': ['천안시', '공주시', '보령시', '아산시', '서산시', '논산시', '계룡시', '당진시', '금산군', '부여군', '서천군', '청양군', '홍성군', '예산군', '태안군'],
            '전북특별자치도': ['전주시', '군산시', '익산시', '정읍시', '남원시', '김제시', '완주군', '진안군', '무주군', '장수군', '임실군', '순창군', '고창군', '부안군'],
            '전라남도': ['목포시', '여수시', '순천시', '나주시', '광양시', '담양군', '곡성군', '구례군', '고흥군', '보성군', '화순군', '장흥군', '강진군', '해남군', '영암군', '무안군', '함평군', '영광군', '장성군', '완도군', '진도군', '신안군'],
            '경상북도': ['포항시', '경주시', '김천시', '안동시', '구미시', '영주시', '영천시', '상주시', '문경시', '경산시', '의성군', '청송군', '영양군', '영덕군', '청도군', '고령군', '성주군', '칠곡군', '예천군', '봉화군', '울진군', '울릉군'],
            '경상남도': ['창원시', '진주시', '통영시', '사천시', '김해시', '밀양시', '거제시', '양산시', '의령군', '함안군', '창녕군', '고성군', '남해군', '하동군', '산청군', '함양군', '거창군', '합천군'],
            '제주특별자치도': ['제주시', '서귀포시']
        };

        // --- 3. Mock Data 생성기 ---
        const generateMockData = () => {
            const data = [];
            let idCounter = 1;
            const facilityTypes = ['청소년수련관', '청소년문화의집', '청소년센터', 'YMCA', 'YWCA', '청소년상담복지센터'];
            
            Object.keys(REGIONS).forEach(province => {
                // 시도별 가중치 (수도권 등 많게)
                let multiplier = 1;
                if (['경기도', '서울특별시'].includes(province)) multiplier = 3;
                else if (['부산광역시', '인천광역시', '경상남도'].includes(province)) multiplier = 2;

                REGIONS[province].forEach(district => {
                    // 구/군별 임의 기관 수 생성 (0 ~ 5개 * 가중치)
                    const count = Math.floor(Math.random() * 5 * multiplier);
                    
                    for (let i = 0; i < count; i++) {
                        // 랜덤하게 1~3개의 사업 배정
                        const numProjects = Math.floor(Math.random() * 3) + 1;
                        const availableProjects = PROJECTS.filter(p => p.id !== 'all');
                        const assignedProjects = [];
                        for(let j=0; j<numProjects; j++) {
                            const randIdx = Math.floor(Math.random() * availableProjects.length);
                            const proj = availableProjects.splice(randIdx, 1)[0];
                            assignedProjects.push(proj.name);
                        }

                        const type = facilityTypes[Math.floor(Math.random() * facilityTypes.length)];
                        
                        data.push({
                            id: idCounter++,
                            province: province,
                            district: district,
                            name: `${district} ${type} ${i>0 ? i+1 : ''}`.trim(),
                            projects: assignedProjects,
                            contact: `0${Math.floor(Math.random() * 8) + 2}-${Math.floor(Math.random() * 9000) + 1000}-${Math.floor(Math.random() * 9000) + 1000}`,
                            website: Math.random() > 0.3 ? `http://www.youth-${idCounter}.or.kr` : ''
                        });
                    }
                });
            });
            return data;
        };

        const facilitiesData = generateMockData();

        // --- STREAMING_CHUNK:데이터 필터링 및 렌더링 로직... ---
        
        // 데이터 필터링 함수
        const getFilteredData = () => {
            return facilitiesData.filter(item => {
                const matchProject = state.project === '전체' || item.projects.includes(state.project);
                const matchProvince = !state.province || item.province === state.province;
                const matchDistrict = !state.district || item.district === state.district;
                const matchSearch = item.name.toLowerCase().includes(state.searchQuery.toLowerCase());
                return matchProject && matchProvince && matchDistrict && matchSearch;
            });
        };

        // UI 업데이트 메인 함수
        const updateDashboard = () => {
            const filteredData = getFilteredData();
            
            updateBreadcrumbs();
            renderProjectTabs();
            updateKPICards(filteredData);
            renderDistrictList(filteredData);
            renderTable(filteredData);
            updateMapColors(); // D3 지도가 준비된 후 호출됨
        };

        // Breadcrumb 업데이트
        const updateBreadcrumbs = () => {
            const parts = [state.project];
            if (state.province) parts.push(state.province);
            if (state.district) parts.push(state.district);
            
            const breadcrumbEl = document.getElementById('breadcrumb');
            breadcrumbEl.innerHTML = parts.join(' <i class="fa-solid fa-chevron-right text-[10px] mx-2 text-gray-400"></i> ');
            
            const resetBtn = document.getElementById('resetFilterBtn');
            if (state.province || state.district || state.project !== '전체' || state.searchQuery) {
                resetBtn.classList.remove('hidden');
            } else {
                resetBtn.classList.add('hidden');
            }
        };

        // 사업 탭 렌더링
        const renderProjectTabs = () => {
            const container = document.getElementById('projectTabs');
            container.innerHTML = '';
            
            PROJECTS.forEach(proj => {
                const isSelected = state.project === proj.name;
                const btn = document.createElement('button');
                
                // 공통 클래스
                let baseClass = "px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 shadow-sm border";
                
                if (isSelected) {
                    // 선택됨: 파란색 테마
                    btn.className = `${baseClass} bg-primary-900 text-white border-primary-900 shadow-md transform scale-[1.02]`;
                } else {
                    // 미선택: 밝은 회색
                    btn.className = `${baseClass} bg-white text-gray-600 border-gray-200 hover:bg-gray-50 hover:text-gray-900`;
                }
                
                btn.textContent = proj.name;
                btn.onclick = () => {
                    state.project = proj.name;
                    // 사업 변경 시 하위 필터(지역) 유지 여부 결정 (보통 유지함)
                    updateDashboard();
                };
                container.appendChild(btn);
            });
        };

        // KPI 카드 업데이트
        const updateKPICards = (data) => {
            const container = document.getElementById('kpiCards');
            
            const totalFacilities = data.length;
            const uniqueProvinces = new Set(data.map(d => d.province)).size;
            const uniqueDistricts = new Set(data.map(d => d.province + d.district)).size;
            
            // 전체 사업 수 계산 (중복 없이 배정된 사업 목록)
            const allProjectsInView = new Set();
            data.forEach(d => d.projects.forEach(p => allProjectsInView.add(p)));
            const totalProjects = allProjectsInView.size;

            const kpis = [
                { title: '운영기관 수', value: totalFacilities, unit: '개', icon: 'fa-building', color: 'text-primary-900', bg: 'bg-blue-50' },
                { title: '참여 시도 수', value: uniqueProvinces, unit: '개', icon: 'fa-map', color: 'text-emerald-600', bg: 'bg-emerald-50' },
                { title: '참여 시군구 수', value: uniqueDistricts, unit: '개', icon: 'fa-map-pin', color: 'text-indigo-600', bg: 'bg-indigo-50' },
                { title: '운영사업 수', value: totalProjects, unit: '종', icon: 'fa-cubes', color: 'text-amber-600', bg: 'bg-amber-50' }
            ];

            container.innerHTML = kpis.map(kpi => `
                <div class="bg-white p-5 rounded-xl shadow-card border border-gray-100 flex items-center justify-between group hover:shadow-card-hover transition-shadow">
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-1">${kpi.title}</p>
                        <div class="flex items-baseline gap-1">
                            <h3 class="text-3xl font-bold text-gray-800 tracking-tight">${kpi.value.toLocaleString()}</h3>
                            <span class="text-sm text-gray-500 font-medium">${kpi.unit}</span>
                        </div>
                    </div>
                    <div class="w-12 h-12 rounded-full ${kpi.bg} flex items-center justify-center transition-transform group-hover:scale-110">
                        <i class="fa-solid ${kpi.icon} ${kpi.color} text-xl"></i>
                    </div>
                </div>
            `).join('');
        };

        // 우측 지역 상세 리스트 렌더링
        const renderDistrictList = (filteredData) => {
            const container = document.getElementById('districtList');
            const header = document.getElementById('selectedRegionHeader');

            if (!state.province) {
                header.innerHTML = `
                    <div class="text-2xl font-bold text-primary-900">전국</div>
                    <div class="text-sm text-gray-500 mt-1">지도의 지역을 클릭하여 시군구별 현황을 확인하세요.</div>
                `;
                
                // 전국 상태일 때는 시도별 요약을 보여줌
                const provCounts = {};
                filteredData.forEach(d => {
                    provCounts[d.province] = (provCounts[d.province] || 0) + 1;
                });
                
                const sortedProvs = Object.entries(provCounts).sort((a,b) => b[1] - a[1]);
                
                container.innerHTML = `
                    <div class="mb-3 px-1 text-sm font-bold text-gray-700">시도별 요약 (운영기관 순)</div>
                    <div class="space-y-2">
                        ${sortedProvs.map(([prov, count]) => `
                            <div class="flex justify-between items-center p-3 hover:bg-gray-50 rounded-lg cursor-pointer border border-transparent hover:border-gray-200 transition-colors"
                                 onclick="if(window.zoomToProvince) window.zoomToProvince('${prov}'); else { state.province='${prov}'; state.district=null; updateDashboard(); }">
                                <span class="font-medium text-gray-700">${prov}</span>
                                <span class="bg-primary-50 text-primary-900 px-2 py-0.5 rounded text-sm font-bold">${count}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }

            // 특정 시도 선택됨
            // 현재 선택된 시도의 데이터만 추출 (사업, 검색 필터 적용된 상태)
            const provData = filteredData.filter(d => d.province === state.province);
            const totalInProv = provData.length;

            header.innerHTML = `
                <div class="flex items-center gap-3">
                    <button class="text-gray-400 hover:text-primary-900 transition-colors" onclick="if(window.resetMapZoom) window.resetMapZoom(); else { state.province=null; state.district=null; updateDashboard(); }" title="전국으로 돌아가기">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="text-2xl font-bold text-primary-900">${state.province}</div>
                </div>
                <div class="text-sm text-gray-600 mt-2 bg-blue-50 inline-block px-3 py-1 rounded-full font-medium">
                    총 운영기관 <span class="text-primary-900 font-bold">${totalInProv}</span>개
                </div>
            `;

            // 시군구별 카운트 계산
            const distCounts = {};
            // 해당 시도의 모든 시군구를 0으로 초기화 (데이터가 없어도 리스트에 보이게)
            REGIONS[state.province].forEach(d => distCounts[d] = 0);
            
            provData.forEach(d => {
                distCounts[d.district] = (distCounts[d.district] || 0) + 1;
            });

            // 이름순 정렬
            const sortedDistricts = Object.entries(distCounts).sort((a,b) => a[0].localeCompare(b[0]));

            container.innerHTML = `
                <div class="space-y-1">
                    <div class="flex justify-between items-center p-3 rounded-lg cursor-pointer transition-colors ${!state.district ? 'bg-primary-50 border-primary-200 border' : 'hover:bg-gray-50 border border-transparent'}"
                         onclick="state.district=null; updateDashboard();">
                        <span class="font-bold text-gray-800">전체보기</span>
                        <span class="text-primary-900 font-bold">${totalInProv}</span>
                    </div>
                    
                    ${sortedDistricts.map(([dist, count]) => {
                        const isSelected = state.district === dist;
                        return `
                        <div class="flex justify-between items-center p-3 rounded-lg cursor-pointer transition-colors ${isSelected ? 'bg-primary-900 text-white shadow-md' : 'hover:bg-gray-50 text-gray-700 border border-transparent hover:border-gray-200'}"
                             onclick="state.district='${dist}'; updateDashboard();">
                            <span class="font-medium ${isSelected ? 'text-white' : ''}">${dist}</span>
                            <span class="${isSelected ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-600'} px-2 py-0.5 rounded text-sm font-bold">${count}</span>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;
        };

        // 데이터 테이블 렌더링
        const renderTable = (filteredData) => {
            const tbody = document.getElementById('facilityTableBody');
            document.getElementById('tableTotalCount').textContent = filteredData.length.toLocaleString();
            
            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-4 py-12 text-center text-gray-500">
                            <div class="flex flex-col items-center gap-3">
                                <i class="fa-regular fa-folder-open text-4xl text-gray-300"></i>
                                <p>조건에 맞는 운영기관이 없습니다.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            // Get color mapping for tags
            const getTagStyle = (projName) => {
                const proj = PROJECTS.find(p => p.name === projName);
                return proj ? proj.color : 'bg-gray-100 text-gray-800 border-gray-200';
            };

            tbody.innerHTML = filteredData.map(item => `
                <tr class="hover:bg-blue-50/50 transition-colors">
                    <td class="px-4 py-3 whitespace-nowrap text-gray-600">${item.province}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-gray-600">${item.district}</td>
                    <td class="px-4 py-3 font-bold text-gray-800">${item.name}</td>
                    <td class="px-4 py-3">
                        <div class="flex flex-wrap gap-1.5">
                            ${item.projects.map(p => `
                                <span class="px-2 py-0.5 rounded text-xs font-medium border ${getTagStyle(p)}">${p}</span>
                            `).join('')}
                        </div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-gray-600 font-mono text-sm">${item.contact}</td>
                    <td class="px-4 py-3 text-center">
                        ${item.website ? `
                            <a href="${item.website}" target="_blank" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-gray-50 text-primary-600 hover:bg-primary-50 hover:text-primary-900 transition-colors" title="홈페이지 방문">
                                <i class="fa-solid fa-link"></i>
                            </a>
                        ` : '<span class="text-gray-300">-</span>'}
                    </td>
                </tr>
            `).join('');
        };

        // --- STREAMING_CHUNK:D3.js 지도 시각화 (Choropleth Map)... ---
        
        let g_muni, g_prov; 
        const width = 800;
        const height = 600;

        window.resetMapZoom = () => {
            state.province = null;
            state.district = null;
            if (window.__d3svg && window.__d3zoom) {
                window.__d3svg.transition().duration(750).call(window.__d3zoom.transform, d3.zoomIdentity);
            }
            if (g_prov && g_muni) {
                g_prov.selectAll("path").transition().duration(400).style("opacity", 1).style("pointer-events", "all");
                g_prov.selectAll(".province-label").transition().duration(400).style("opacity", 1);
                g_muni.selectAll("path").transition().duration(400).style("opacity", 0).style("pointer-events", "none");
            }
            updateDashboard();
        };

        const initMap = async () => {
            const container = document.getElementById('mapContainer');
            
            const svg = d3.select("#mapContainer").append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("width", "100%")
                .attr("height", "100%")
                .style("background-color", "transparent")
                .style("filter", "drop-shadow(0px 4px 10px rgba(0,0,0,0.05))"); // 맵 전체에 부드러운 그림자

            g_muni = svg.append("g"); // 시군구 레이어 (아래)
            g_prov = svg.append("g"); // 시도 레이어 (위)

            // 줌 동작 설정
            const zoom = d3.zoom()
                .scaleExtent([1, 8])
                .on("zoom", (event) => {
                    g_muni.attr("transform", event.transform);
                    g_prov.attr("transform", event.transform);
                });

            svg.call(zoom);
            window.__d3svg = svg;
            window.__d3zoom = zoom;
            
            d3.select("#zoomInBtn").on("click", () => svg.transition().call(zoom.scaleBy, 1.5));
            d3.select("#zoomOutBtn").on("click", () => svg.transition().call(zoom.scaleBy, 0.75));
            d3.select("#zoomResetBtn").on("click", window.resetMapZoom);

            try {
                // 시도 및 시군구 데이터를 동시에 병렬로 불러옴
                const [provGeojson, muniGeojson] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_provinces_geo_simple.json').then(r => r.json()),
                    fetch('https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_municipalities_geo_simple.json').then(r => r.json())
                ]);

                // 알버트 투영법 적용 (한국 중심)
                const projection = d3.geoAlbers()
                    .center([127.5, 36.4])
                    .rotate([0, 0])
                    .scale(6000)
                    .translate([width / 2, height / 2]);

                const path = d3.geoPath().projection(projection);

                const nameMapping = {
                    '서울특별시': '서울특별시', '부산광역시': '부산광역시', '대구광역시': '대구광역시',
                    '인천광역시': '인천광역시', '광주광역시': '광주광역시', '대전광역시': '대전광역시',
                    '울산광역시': '울산광역시', '세종특별자치시': '세종특별자치시', '경기도': '경기도',
                    '강원도': '강원특별자치도', '충청북도': '충청북도', '충청남도': '충청남도',
                    '전라북도': '전북특별자치도', '전라남도': '전라남도', '경상북도': '경상북도',
                    '경상남도': '경상남도', '제주특별자치도': '제주특별자치도'
                };

                const PROV_CODES = {
                    '11': '서울특별시', '21': '부산광역시', '22': '대구광역시', '23': '인천광역시',
                    '24': '광주광역시', '25': '대전광역시', '26': '울산광역시', '29': '세종특별자치시',
                    '31': '경기도', '32': '강원특별자치도', '33': '충청북도', '34': '충청남도',
                    '35': '전북특별자치도', '36': '전라남도', '37': '경상북도', '38': '경상남도', '39': '제주특별자치도'
                };

                // 1. 시군구(하위) 레이어 그리기
                muniGeojson.features.forEach(d => {
                    const codePrefix = d.properties.code.substring(0,2);
                    d.properties.provName = PROV_CODES[codePrefix] || '알수없음';
                });

                g_muni.selectAll("path")
                    .data(muniGeojson.features)
                    .enter().append("path")
                    .attr("class", "municipality-path")
                    .attr("d", path)
                    .attr("id", d => d.properties.name)
                    .style("opacity", 0) // 처음에는 숨김
                    .style("pointer-events", "none")
                    .on("mouseover", handleMuniMouseOver)
                    .on("mouseout", handleMuniMouseOut)
                    .on("click", handleMuniClick);

                // 2. 시도(상위) 레이어 그리기
                g_prov.selectAll("path")
                    .data(provGeojson.features)
                    .enter().append("path")
                    .attr("class", "province-path")
                    .attr("d", path)
                    .attr("id", d => nameMapping[d.properties.name] || d.properties.name)
                    .on("mouseover", handleProvMouseOver)
                    .on("mouseout", handleProvMouseOut)
                    .on("click", handleProvClick);

                // 시도 텍스트 라벨 추가
                g_prov.selectAll("text")
                    .data(provGeojson.features)
                    .enter().append("text")
                    .attr("class", "province-label")
                    .attr("transform", d => {
                        const centroid = path.centroid(d);
                        if (d.properties.name === '경기도') return `translate(${centroid[0] + 10}, ${centroid[1] + 20})`;
                        if (d.properties.name === '충청남도') return `translate(${centroid[0] - 10}, ${centroid[1]})`;
                        return `translate(${centroid})`;
                    })
                    .text(d => {
                        const mappedName = nameMapping[d.properties.name] || d.properties.name;
                        if (mappedName.length > 4) return mappedName.slice(0, 2);
                        return mappedName.replace('광역시','').replace('특별시','').replace('특별자치도','').replace('특별자치시','');
                    });

                // 외부 호출용 Province 줌 함수 정의 (리스트 클릭 시)
                window.zoomToProvince = function(provName) {
                    const node = g_prov.selectAll("path").filter(function() { return this.id === provName; }).node();
                    if (node) {
                        const d = d3.select(node).datum();
                        handleProvClick.call(node, null, d);
                    } else {
                        state.province = provName;
                        state.district = null;
                        updateDashboard();
                    }
                };

                // 시도 클릭 시 줌 및 시군구 표시 로직
                function handleProvClick(event, d) {
                    const provName = this.id;
                    state.province = provName;
                    state.district = null;
                    
                    // 선택 지역 바운딩 박스 계산
                    const bounds = path.bounds(d);
                    const dx = bounds[1][0] - bounds[0][0];
                    const dy = bounds[1][1] - bounds[0][1];
                    const x = (bounds[0][0] + bounds[1][0]) / 2;
                    const y = (bounds[0][1] + bounds[1][1]) / 2;
                    const scale = Math.max(1, Math.min(8, 0.8 / Math.max(dx / width, dy / height)));
                    const translate = [width / 2 - scale * x, height / 2 - scale * y];

                    // 줌 애니메이션
                    svg.transition().duration(750).call(
                        zoom.transform, 
                        d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
                    );

                    // 시도 레이어는 클릭된 것을 제외하고 숨김 (배경 컨텍스트 제공)
                    g_prov.selectAll("path").transition().duration(400)
                        .style("opacity", p => (nameMapping[p.properties.name] || p.properties.name) === provName ? 0 : 0.3)
                        .style("pointer-events", "none");
                    
                    g_prov.selectAll(".province-label").transition().duration(400).style("opacity", 0);

                    // 해당 시도의 시군구 레이어 보이기
                    g_muni.selectAll("path").transition().duration(400)
                        .style("opacity", m => m.properties.provName === provName ? 1 : 0)
                        .style("pointer-events", m => m.properties.provName === provName ? "all" : "none");

                    updateDashboard();
                }

                document.getElementById('mapLoading').style.display = 'none';
                updateMapColors();

            } catch (error) {
                console.error("Map loading failed", error);
                document.getElementById('mapLoading').innerHTML = '<p class="text-red-500">지도 데이터를 불러올 수 없습니다.</p>';
            }
        };

        const getColorScale = (data) => {
            const counts = Object.keys(REGIONS).map(prov => data.filter(d => d.province === prov).length);
            const maxCount = Math.max(...counts, 1);
            
            // 제공된 이미지처럼 부드럽고 따뜻한 느낌을 주기 위해 약간 더 밝고 산뜻한 파란색 계열 사용
            return d3.scaleLinear()
                .domain([0, maxCount * 0.3, maxCount * 0.6, maxCount])
                .range(['#f1f5f9', '#bae6fd', '#7dd3fc', '#0284c7']); 
        };

        const updateMapColors = () => {
            if (!g_prov || !g_muni) return;

            const mapBaseData = facilitiesData.filter(item => state.project === '전체' || item.projects.includes(state.project));
            const colorScale = getColorScale(mapBaseData);
            
            // 시도별 카운트
            const provCounts = {};
            Object.keys(REGIONS).forEach(p => provCounts[p] = 0);
            mapBaseData.forEach(d => provCounts[d.province]++);

            g_prov.selectAll(".province-path")
                .transition().duration(500)
                .attr("fill", function() {
                    const count = provCounts[this.id] || 0;
                    return count > 0 ? colorScale(count) : "#f1f5f9";
                });

            // 시군구별 카운트 (부분 일치 로직 포함 - MockData와 GeoJSON 명칭 차이 보정)
            const distCounts = {};
            mapBaseData.forEach(d => {
                const exactKey = `${d.province}_${d.district}`;
                distCounts[exactKey] = (distCounts[exactKey] || 0) + 1;
            });

            const getMuniCount = (prov, muni) => {
                const exactKey = `${prov}_${muni}`;
                if (distCounts[exactKey] !== undefined) return distCounts[exactKey];
                
                // Ex: GeoJSON="수원시 장안구", MockData="수원시" 인 경우 매핑 연결
                const partialMatch = Object.keys(distCounts).find(k => 
                    k.startsWith(prov) && (muni.includes(k.split('_')[1]) || k.split('_')[1].includes(muni.split(' ')[0]))
                );
                return partialMatch ? distCounts[partialMatch] : 0;
            };

            g_muni.selectAll(".municipality-path")
                .transition().duration(500)
                .attr("fill", function(d) {
                    const count = getMuniCount(d.properties.provName, d.properties.name);
                    // 시군구는 영역이 작으므로 색상을 살짝 강조 (x1.5)
                    return count > 0 ? colorScale(count * 1.5) : "#f8fafc";
                })
                .attr("stroke", function() {
                    return state.district === this.id ? "#1e293b" : "#ffffff";
                })
                .attr("stroke-width", function() {
                    return state.district === this.id ? "2.5px" : "1.5px";
                });

            renderLegend(colorScale, provCounts);
        };

        const renderLegend = (colorScale, provCounts) => {
            const max = Math.max(...Object.values(provCounts), 1);
            const legendEl = document.getElementById('mapLegend');
            legendEl.innerHTML = `
                <span class="text-gray-400 mr-1">0</span>
                <div class="w-4 h-4 rounded-sm" style="background-color: ${colorScale(0)}"></div>
                <div class="w-4 h-4 rounded-sm" style="background-color: ${colorScale(max*0.3)}"></div>
                <div class="w-4 h-4 rounded-sm" style="background-color: ${colorScale(max*0.6)}"></div>
                <div class="w-4 h-4 rounded-sm" style="background-color: ${colorScale(max)}"></div>
                <span class="text-gray-700 ml-1 font-bold">${max}</span>
            `;
        };

        const tooltip = d3.select("#tooltip");

        function handleProvMouseOver(event, d) {
            const provName = this.id;
            const mapBaseData = facilitiesData.filter(item => state.project === '전체' || item.projects.includes(state.project));
            const count = mapBaseData.filter(item => item.province === provName).length;

            tooltip.transition().duration(200).style("opacity", .95);
            tooltip.html(`
                <div class="font-bold text-gray-800 border-b border-gray-100 pb-1 mb-1">${provName}</div>
                <div class="text-gray-600">운영기관: <span class="font-bold text-primary-900">${count}</span>개</div>
            `)
            .style("left", (event.pageX + 15) + "px")
            .style("top", (event.pageY - 28) + "px");
        }

        function handleProvMouseOut() {
            tooltip.transition().duration(500).style("opacity", 0);
        }

        function handleMuniMouseOver(event, d) {
            const distName = d.properties.name;
            const provName = d.properties.provName;
            
            const mapBaseData = facilitiesData.filter(item => state.project === '전체' || item.projects.includes(state.project));
            let count = mapBaseData.filter(item => item.province === provName && item.district === distName).length;
            
            // 모의 데이터 매핑 보정
            if(count === 0) {
                const partialMatch = mapBaseData.filter(item => item.province === provName && (distName.includes(item.district) || item.district.includes(distName.split(' ')[0])));
                count = partialMatch.length;
            }

            d3.select(this).attr("stroke", "#0284c7").attr("stroke-width", "2px");

            tooltip.transition().duration(200).style("opacity", .95);
            tooltip.html(`
                <div class="font-bold text-gray-800 border-b border-gray-100 pb-1 mb-1">${provName} ${distName}</div>
                <div class="text-gray-600">운영기관: <span class="font-bold text-primary-900">${count}</span>개</div>
            `)
            .style("left", (event.pageX + 15) + "px")
            .style("top", (event.pageY - 28) + "px");
        }

        function handleMuniMouseOut() {
            d3.select(this)
                .attr("stroke", state.district === this.id ? "#1e293b" : "#ffffff")
                .attr("stroke-width", state.district === this.id ? "2.5px" : "1.5px");
            tooltip.transition().duration(500).style("opacity", 0);
        }

        function handleMuniClick(event, d) {
            // 시군구 클릭 시에는 줌 변경 없이 데이터만 갱신
            // 주의: GeoJSON 구 이름(예:수원시 장안구)을 기반으로 현재 Mock 데이터 포맷(예:수원시)과 유사 매칭시킵니다.
            let matchedDistrict = d.properties.name;
            const provData = facilitiesData.filter(item => item.province === d.properties.provName);
            
            if(!provData.some(item => item.district === matchedDistrict)) {
                const partial = provData.find(item => matchedDistrict.includes(item.district) || item.district.includes(matchedDistrict.split(' ')[0]));
                if(partial) matchedDistrict = partial.district;
            }

            if (state.district === matchedDistrict) {
                state.district = null; // 선택 해제
            } else {
                state.district = matchedDistrict;
            }
            updateDashboard();
        }

        // --- STREAMING_CHUNK:초기화 및 이벤트 리스너 바인딩... ---
        
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                updateDashboard();
            });

            document.getElementById('resetFilterBtn').addEventListener('click', () => {
                state.project = '전체';
                state.searchQuery = '';
                document.getElementById('searchInput').value = '';
                window.resetMapZoom();
            });

            updateDashboard();
            initMap();
        });

    </script>
</body>
</html>
